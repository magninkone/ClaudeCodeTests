<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      height: 1.5rem;
      color: #a8dadc;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.04);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win {
      background: #0f3460;
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    #scoreboard {
      display: flex;
      gap: 2rem;
      margin-top: 1.8rem;
      font-size: 1rem;
    }

    .score-box {
      text-align: center;
      background: #16213e;
      padding: 0.6rem 1.4rem;
      border-radius: 10px;
    }

    .score-box .label { color: #888; font-size: 0.8rem; margin-bottom: 2px; }
    .score-box .value { font-size: 1.5rem; font-weight: bold; }
    .score-x .value { color: #e94560; }
    .score-draw .value { color: #f4a261; }
    .score-o .value { color: #a8dadc; }

    #reset-btn {
      margin-top: 1.8rem;
      padding: 0.6rem 2rem;
      font-size: 1rem;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #reset-btn:hover { background: #c73652; }

    #mode-toggle {
      margin-top: 0.8rem;
      padding: 0.5rem 1.6rem;
      font-size: 0.9rem;
      background: #0f3460;
      color: #a8dadc;
      border: 1px solid #a8dadc55;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #mode-toggle:hover { background: #16213e; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status">X's turn</div>

  <div id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <div id="scoreboard">
    <div class="score-box score-x">
      <div class="label">X</div>
      <div class="value" id="score-x">0</div>
    </div>
    <div class="score-box score-draw">
      <div class="label">Draw</div>
      <div class="value" id="score-draw">0</div>
    </div>
    <div class="score-box score-o">
      <div class="label">O</div>
      <div class="value" id="score-o">0</div>
    </div>
  </div>

  <button id="reset-btn">New Game</button>
  <button id="mode-toggle">vs CPU: OFF</button>

  <script>
    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset-btn');
    const modeToggle = document.getElementById('mode-toggle');
    const scoreX = document.getElementById('score-x');
    const scoreDraw = document.getElementById('score-draw');
    const scoreO = document.getElementById('score-o');

    const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    let board, current, gameOver, vsCPU, scores;

    function init() {
      board = Array(9).fill(null);
      current = 'X';
      gameOver = false;
      cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
      statusEl.textContent = "X's turn";
    }

    function initAll() {
      scores = { X: 0, Draw: 0, O: 0 };
      vsCPU = false;
      updateScoreboard();
      init();
    }

    function updateScoreboard() {
      scoreX.textContent = scores.X;
      scoreDraw.textContent = scores.Draw;
      scoreO.textContent = scores.O;
    }

    function checkWin(b, p) {
      return WINS.find(line => line.every(i => b[i] === p)) || null;
    }

    function handleClick(i) {
      if (gameOver || board[i]) return;
      place(i, current);
      if (!gameOver && vsCPU && current === 'O') {
        setTimeout(() => { if (!gameOver) cpuMove(); }, 300);
      }
    }

    function place(i, player) {
      board[i] = player;
      const cell = cells[i];
      cell.textContent = player;
      cell.classList.add('taken', player.toLowerCase());

      const winLine = checkWin(board, player);
      if (winLine) {
        winLine.forEach(j => cells[j].classList.add('win'));
        statusEl.textContent = `${player} wins!`;
        scores[player]++;
        updateScoreboard();
        gameOver = true;
        return;
      }
      if (board.every(Boolean)) {
        statusEl.textContent = "It's a draw!";
        scores.Draw++;
        updateScoreboard();
        gameOver = true;
        return;
      }
      current = current === 'X' ? 'O' : 'X';
      statusEl.textContent = `${current}'s turn${vsCPU && current === 'O' ? ' (CPU)' : ''}`;
    }

    // Minimax AI
    function minimax(b, isMax) {
      if (checkWin(b, 'O')) return 10;
      if (checkWin(b, 'X')) return -10;
      if (b.every(Boolean)) return 0;
      if (isMax) {
        let best = -Infinity;
        b.forEach((v, i) => { if (!v) { b[i]='O'; best=Math.max(best,minimax(b,false)); b[i]=null; } });
        return best;
      } else {
        let best = Infinity;
        b.forEach((v, i) => { if (!v) { b[i]='X'; best=Math.min(best,minimax(b,true)); b[i]=null; } });
        return best;
      }
    }

    function cpuMove() {
      let best = -Infinity, move = -1;
      board.forEach((v, i) => {
        if (!v) {
          board[i] = 'O';
          const score = minimax(board, false);
          board[i] = null;
          if (score > best) { best = score; move = i; }
        }
      });
      if (move !== -1) place(move, 'O');
    }

    cells.forEach(cell => cell.addEventListener('click', () => {
      if (vsCPU && current === 'O') return;
      handleClick(+cell.dataset.i);
    }));

    resetBtn.addEventListener('click', init);

    modeToggle.addEventListener('click', () => {
      vsCPU = !vsCPU;
      modeToggle.textContent = `vs CPU: ${vsCPU ? 'ON' : 'OFF'}`;
      init();
    });

    initAll();
  </script>
</body>
</html>
